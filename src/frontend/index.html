<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAUIS Widget</title>
    <style>
        :root {
            --bg: rgba(28, 33, 44, 0.92);
            --text: #f3f5ff;
            --subtle: #9fa9c6;
            --accent: #7ed3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: transparent;
            height: 100vh;
            display: grid;
            place-items: center;
            -webkit-app-region: drag;
        }

        .widget {
            width: 220px;
            border-radius: 16px;
            padding: 14px;
            background: var(--bg);
            color: var(--text);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .title {
            font-size: 11px;
            color: var(--subtle);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .mood {
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 10px;
            color: var(--accent);
            transition: color 160ms ease;
        }

        .row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--subtle);
        }

        .value {
            color: var(--text);
            font-weight: 600;
        }

        .angry {
            --accent: #ff7a7a;
        }

        .neutral {
            --accent: #7ed3ff;
        }

        .happy {
            --accent: #89f5ac;
        }
    </style>
</head>

<body>
    <main id="widget" class="widget neutral">
        <p class="title">Emotion Widget</p>
        <p id="moodWord" class="mood">Neutral</p>
        <div class="row">
            <span>APM</span>
            <span id="apmValue" class="value">0</span>
        </div>
    </main>

    <script>
        const keyTimestamps = [];
        const joyTimestamps = [];
        const moodWord = document.getElementById('moodWord');
        const apmValue = document.getElementById('apmValue');
        const widget = document.getElementById('widget');

        const JOY_PATTERNS = [
            /(^|\W)lol(\W|$)/i,
            /(^|\W)lmao(\W|$)/i,
            /(^|\W)rofl(\W|$)/i,
            /h[ae]{1,}h[ae]{1,}/i,
            /(^|\W)hehe+/i,
            /(^|\W)yay+(\W|$)/i,
            /😂|🤣|😆|😄|😀/
        ];

        const NON_ACTIVITY_KEYS = new Set([
            'Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab', 'Escape',
            'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End',
            'PageUp', 'PageDown', 'Insert', 'Delete', 'NumLock', 'ScrollLock'
        ]);

        let recentText = '';
        let smoothedApm = 0;
        let lastTrackedAt = 0;
        let globalInputHooked = false;

        function trimWindow(queue, msWindow) {
            const cutoff = Date.now() - msWindow;
            while (queue.length > 0 && queue[0] < cutoff) {
                queue.shift();
            }
        }

        function computeAPM() {
            trimWindow(keyTimestamps, 60000);
            const rawApm = keyTimestamps.length;
            smoothedApm = smoothedApm === 0
                ? rawApm
                : (smoothedApm * 0.72) + (rawApm * 0.28);
            return Math.round(smoothedApm);
        }

        function hasRecentJoySignal() {
            trimWindow(joyTimestamps, 20000);
            return joyTimestamps.length > 0;
        }

        function detectJoyFromBuffer() {
            return JOY_PATTERNS.some((pattern) => pattern.test(recentText));
        }

        function trackActivity(eventTime = Date.now()) {
            if ((eventTime - lastTrackedAt) <= 35) {
                return;
            }

            keyTimestamps.push(eventTime);
            lastTrackedAt = eventTime;
        }

        function moodFromSignals(apm) {
            const joyActive = hasRecentJoySignal();

            if (apm >= 140) return 'Angry';
            if (joyActive) return 'Happy';
            if (apm >= 85) return 'Happy';
            return 'Neutral';
        }

        function applyMoodUI(mood, apm) {
            moodWord.textContent = mood;
            apmValue.textContent = String(apm);
            widget.classList.remove('angry', 'neutral', 'happy');
            widget.classList.add(mood.toLowerCase());
        }

        async function saveSnapshot(mood, apm) {
            if (!window.eauisAPI || !window.eauisAPI.saveMoodSnapshot) return;
            try {
                await window.eauisAPI.saveMoodSnapshot({
                    apm,
                    computedMood: mood,
                    source: 'widget-keydown'
                });
            } catch (_error) {
                // Keep widget responsive even if backend save fails.
            }
        }

        document.addEventListener('keydown', (event) => {
            const now = Date.now();

            // Fallback activity tracking when global hook is unavailable.
            if (!globalInputHooked && !NON_ACTIVITY_KEYS.has(event.key)) {
                trackActivity(now);
            }

            if (event.key === 'Backspace') {
                recentText = recentText.slice(0, -1);
            } else if (event.key === 'Enter' || event.key === ' ') {
                recentText += ' ';
            } else if (event.key.length === 1) {
                recentText += event.key.toLowerCase();
            }

            if (recentText.length > 200) {
                recentText = recentText.slice(-200);
            }

            if (detectJoyFromBuffer()) {
                joyTimestamps.push(now);
            }
        });

        if (window.eauisAPI && typeof window.eauisAPI.onGlobalKeyActivity === 'function') {
            window.eauisAPI.onGlobalKeyActivity((data) => {
                globalInputHooked = true;
                const when = data && typeof data.when === 'number' ? data.when : Date.now();
                trackActivity(when);
            });
        }

        setInterval(() => {
            const apm = computeAPM();
            const mood = moodFromSignals(apm);
            applyMoodUI(mood, apm);
        }, 500);

        setInterval(() => {
            const apm = computeAPM();
            const mood = moodFromSignals(apm);
            saveSnapshot(mood, apm);
        }, 5000);

        (async () => {
            try {
                if (window.eauisAPI && window.eauisAPI.getMood) {
                    const latest = await window.eauisAPI.getMood();
                    if (latest && typeof latest.apm === 'number' && latest.computed_mood) {
                        smoothedApm = latest.apm;
                        applyMoodUI(latest.computed_mood, latest.apm);
                    }
                }
            } catch (_error) {
                // Ignore bootstrap errors and keep defaults.
            }
        })();
    </script>
</body>

</html>
