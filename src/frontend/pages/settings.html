<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/settings.css">
    <link rel="stylesheet" href="../assets/boxicons-2.1.4/css/boxicons.min.css">
</head>

<body>
    <div class="page-wrapper">
        <section class="header-area">
            <h1 class="main-text">System Behavior</h1>
            <p class="sub-text">Adjust based on your preferences.</p>
        </section>

        <div class="settings-card">
            <div class="settings-row">
                <div class="row-info">
                    <span class="row-title">Auto-Theme</span>
                    <span class="row-desc">Adjust UI based on mood</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="auto-theme-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="settings-row">
                <div class="row-info">
                    <span class="row-title">Character-only Widget Mode</span>
                    <span class="row-desc">Switch to compact floating companion view</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="widget-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="settings-row">
                <div class="row-info">
                    <span class="row-title">Dark Mode</span>
                    <span class="row-desc">Easy on the eyes in low light</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        (async function () {
            const autoThemeToggle = document.getElementById('auto-theme-toggle');
            const darkModeToggle = document.getElementById('dark-mode-toggle');
            const widgetToggle = document.getElementById('widget-toggle');

            if (!window.api) return;

            // --- Load Saved States ---
            autoThemeToggle.checked = localStorage.getItem('autoTheme') === 'true';
            darkModeToggle.checked = localStorage.getItem('darkMode') === 'true';

            try {
                const currentMode = await window.api.getWidgetOnlyMode();
                widgetToggle.checked = Boolean(currentMode);
            } catch (err) { console.error(err); }

            // --- Event Listeners ---
            autoThemeToggle.addEventListener('change', () => {
                localStorage.setItem('autoTheme', autoThemeToggle.checked);
                if (!autoThemeToggle.checked) {
                    document.body.setAttribute('data-mood', 'neutral');
                }
            });

            darkModeToggle.addEventListener('change', () => {
                localStorage.setItem('darkMode', darkModeToggle.checked);
                document.body.classList.toggle('dark-mode', darkModeToggle.checked);
            });

            widgetToggle.addEventListener('change', async () => {
                try {
                    await window.api.setWidgetOnlyMode(widgetToggle.checked);
                } catch (err) {
                    widgetToggle.checked = !widgetToggle.checked;
                }
            });
        })();

        // --- Modal & Accent UI Logic ---
        let tempAccent = '';

        window.openModal = function (id) {
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById(id).style.display = 'block';
        };

        window.closeAllModals = function () {
            document.getElementById('modal-overlay').style.display = 'none';
            document.querySelectorAll('.custom-modal').forEach(m => m.style.display = 'none');
        };

        window.selectAccentItem = (element, accent) => {
            document.querySelectorAll('[data-accent]').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            tempAccent = accent;
        };

        window.applyAccentChanges = () => {
            if (tempAccent) {
                document.body.classList.remove('accent-blue', 'accent-red', 'accent-plain');

                document.body.classList.add(`accent-${tempAccent}`);

                localStorage.setItem('userAccent', tempAccent);
            }
            closeAllModals();
        };
    </script>
</body>

</html>
