<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/settings.css">
    <link rel="stylesheet" href="../assets/boxicons-2.1.4/css/boxicons.min.css">
</head>

<body>
    <div class="page-wrapper">
        <section class="header-area">
            <h1 class="main-text">System Behavior</h1>
            <p class="sub-text">Adjust based on your preferences.</p>
        </section>

        <div class="settings-card">
            <div class="settings-row">
                <div class="row-info">
                    <span class="row-title">Auto-Theme</span>
                    <span class="row-desc">Adjust UI based on mood</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="auto-theme-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="settings-row">
                <div class="row-info">
                    <span class="row-title">Character-only Widget Mode</span>
                    <span class="row-desc">Switch to compact floating companion view</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="widget-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="settings-row">
                <div class="row-info">
                    <span class="row-title">Dark Mode</span>
                    <span class="row-desc">Easy on the eyes in low light</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        (async function () {
            const autoThemeToggle = document.getElementById('auto-theme-toggle');
            const darkModeToggle = document.getElementById('dark-mode-toggle');
            const widgetToggle = document.getElementById('widget-toggle');

            if (!autoThemeToggle || !darkModeToggle || !widgetToggle) {
                return;
            }

            // --- Load Saved States ---
            autoThemeToggle.checked = localStorage.getItem('autoTheme') === 'true';
            darkModeToggle.checked = localStorage.getItem('darkMode') === 'true';
            document.body.setAttribute('data-theme', darkModeToggle.checked ? 'dark' : 'light');

            const applyEmotionTheme = () => {
                const isAutoTheme = autoThemeToggle.checked;
                if (!isAutoTheme) {
                    document.body.setAttribute('data-emotion', 'manual');
                    return;
                }

                const currentState = window.MoodTracker && typeof window.MoodTracker.getState === 'function'
                    ? window.MoodTracker.getState()
                    : null;
                const mood = currentState && currentState.mood ? String(currentState.mood).toLowerCase() : 'neutral';
                document.body.setAttribute('data-emotion', mood);
            };

            applyEmotionTheme();

            if (window.api && typeof window.api.getWidgetOnlyMode === 'function') {
                try {
                    const currentMode = await window.api.getWidgetOnlyMode();
                    widgetToggle.checked = Boolean(currentMode);
                } catch (err) {
                    console.error(err);
                    widgetToggle.checked = false;
                }
            } else {
                widgetToggle.checked = false;
                widgetToggle.disabled = true;
                widgetToggle.title = 'Widget mode is unavailable in this context';
            }

            // --- Event Listeners ---
            autoThemeToggle.addEventListener('change', () => {
                localStorage.setItem('autoTheme', autoThemeToggle.checked);
                applyEmotionTheme();
            });

            darkModeToggle.addEventListener('change', () => {
                localStorage.setItem('darkMode', darkModeToggle.checked);
                document.body.setAttribute('data-theme', darkModeToggle.checked ? 'dark' : 'light');
            });

            widgetToggle.addEventListener('change', async () => {
                if (!window.api || typeof window.api.setWidgetOnlyMode !== 'function') {
                    widgetToggle.checked = !widgetToggle.checked;
                    return;
                }

                try {
                    await window.api.setWidgetOnlyMode(widgetToggle.checked);
                } catch (err) {
                    widgetToggle.checked = !widgetToggle.checked;
                }
            });
        })();
    </script>
</body>

</html>
