<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../assets/boxicons-2.1.4/css/boxicons.min.css">

</head>

<body>
    <div class="page-wrapper">
        <section class="header-area">
            <h1 class="main-text">Hello, User!</h1>
            <p class="sub-text">How are we feeling today?</p>
        </section>

        <div class="status-card">
            <div class="card-header">
                <span class="state-label">User State: <span class="current-mood"></span></span>
                <button class="edit-btn" onclick="openModal('widget-modal')">
                    <i class='bx bxs-edit-alt'></i>
                </button>
            </div>

            <div class="sprite-display">
                <img id="mood-sprite" alt="Character">
            </div>

            <div class="mood-selectors">
                <div class="mood-option mood-happy">
                    <span class="dot yellow"></span>
                    <span>Happy</span>
                </div>
                <div class="mood-option mood-neutral">
                    <span class="dot gray"></span>
                    <span>Neutral</span>
                </div>
                <div class="mood-option mood-stressed">
                    <span class="dot red"></span>
                    <span>Stressed</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // 1. Configuration
            const CURRENT_USER_MOOD = 'neutral';

            const syncUI = () => {
                const stateText = document.querySelector('.current-mood');
                const spriteImg = document.getElementById('mood-sprite');
                const moodOptions = document.querySelectorAll('.mood-option');

                // Check if elements exist (Crucial for routers)
                if (!stateText || !spriteImg || !document.querySelector(`.mood-${CURRENT_USER_MOOD}`)) {
                    return false;
                }

                function updateUI(mood) {
                    const targetOption = document.querySelector(`.mood-${mood}`);
                    if (!targetOption) return;

                    // Update Label
                    stateText.textContent = mood.charAt(0).toUpperCase() + mood.slice(1);

                    // Update Animation via SpriteEngine
                    if (window.SpriteEngine) {
                        window.SpriteEngine.play(spriteImg, 'pikachu', mood, 400);
                    }

                    // Update Dots
                    moodOptions.forEach(opt => opt.classList.remove('active'));
                    targetOption.classList.add('active');
                }

                // Attach Click Listeners for testing
                moodOptions.forEach(option => {
                    option.onclick = () => {
                        if (option.classList.contains('mood-happy')) updateUI('happy');
                        if (option.classList.contains('mood-neutral')) updateUI('neutral');
                        if (option.classList.contains('mood-stressed')) updateUI('stressed');
                    };
                });

                // Initial Run
                updateUI(CURRENT_USER_MOOD);
                return true;
            };

            // Retry loop to ensure elements are found after router injection
            const checkExist = setInterval(() => {
                if (syncUI()) clearInterval(checkExist);
            }, 20);
        })();
    </script>
</body>

</html>
