<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../assets/boxicons-2.1.4/css/boxicons.min.css">

</head>

<body>
    <div class="page-wrapper">
        <section class="header-area">
            <h1 class="main-text">Hello, User!</h1>
            <p class="sub-text">How are we feeling today?</p>
        </section>

        <div class="status-card">
            <div class="card-header">
                <span class="state-label">User State: <span class="current-mood"></span></span>
                <button class="edit-btn" onclick="openModal('widget-modal')">
                    <i class='bx bxs-edit-alt'></i>
                </button>
            </div>

            <div class="sprite-display">
                <img id="mood-sprite" alt="Character">
            </div>

            <div class="mood-selectors">
                <div class="mood-option mood-happy">
                    <span class="dot yellow"></span>
                    <span>Happy</span>
                </div>
                <div class="mood-option mood-neutral">
                    <span class="dot gray"></span>
                    <span>Neutral</span>
                </div>
                <div class="mood-option mood-focused">
                    <span class="dot gray"></span>
                    <span>Focused</span>
                </div>
                <div class="mood-option mood-angry">
                    <span class="dot red"></span>
                    <span>Angry</span>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/moodAlgorithmConfig.js"></script>
    <script src="../js/moodTracker.js"></script>
    <script>
        (function () {
            const stateText = document.querySelector('.current-mood');
            const spriteImg = document.getElementById('mood-sprite');
            const moodOptions = document.querySelectorAll('.mood-option');

            if (!stateText || !spriteImg) {
                return;
            }

            function normalizeMood(mood) {
                const value = String(mood || 'Neutral').toLowerCase();
                if (value === 'angry') return 'angry';
                if (value === 'happy') return 'happy';
                if (value === 'focused') return 'focused';
                if (value === 'neutral') return 'neutral';
                return 'neutral';
            }

            function applyHomeState(state) {
                const moodKey = normalizeMood(state.mood);
                const moodText = moodKey.charAt(0).toUpperCase() + moodKey.slice(1);

                stateText.textContent = moodText;
                moodOptions.forEach((option) => option.classList.remove('active'));

                const activeOption = document.querySelector(`.mood-${moodKey}`);
                if (activeOption) {
                    activeOption.classList.add('active');
                }

                const applyCharacter = (character) => {
                    const selectedWidget = character || 'pikachu';
                    const spriteMood = moodKey === 'focused' ? 'neutral' : moodKey;
                    if (window.SpriteEngine) {
                        window.SpriteEngine.play(spriteImg, selectedWidget, spriteMood, 400);
                    }
                };

                if (window.getSelectedCharacter) {
                    window.getSelectedCharacter().then(applyCharacter).catch(() => applyCharacter('pikachu'));
                } else {
                    applyCharacter('pikachu');
                }
            }

            if (window.MoodTracker) {
                window.MoodTracker.start();
                window.MoodTracker.subscribe(applyHomeState);
            }

            window.addEventListener('character-changed', () => {
                if (window.MoodTracker && typeof window.MoodTracker.getState === 'function') {
                    applyHomeState(window.MoodTracker.getState());
                }
            });
        })();
    </script>
</body>

</html>
