<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../assets/boxicons-2.1.4/css/boxicons.min.css">
    <script src="../js/modalHandler.js"></script>
</head>

<body>
    <header class="title-bar">
        <div class="window-controls">
            <button class="control-btn min-btn" onclick="window.api.minimizeWindow()">&minus;</button>
            <button class="control-btn close-btn" onclick="window.api.closeWindow()">&times;</button>
        </div>
    </header>

    <div class="main-wrapper">
        <div class="app-container">
            <main id="main-content"></main>
        </div>

        <nav class="bottom-nav">
            <div class="nav-toggle">
                <button class="nav-item active" onclick="loadPage('home')">
                    <i class='bx bxs-layer'></i>
                </button>
                <button class="nav-item" onclick="loadPage('history')">
                    <i class='bx bxs-bar-chart-alt-2'></i>
                </button>
            </div>
            <button class="settings-fab" onclick="loadPage('settings')">
                <i class='bx bxs-wrench'></i>
            </button>
        </nav>
    </div>

    <div id="modal-overlay" class="modal-overlay" onclick="closeAllModals()">
        <div id="widget-modal" class="custom-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div>
                    <h2 class="modal-main-text">Switch Widget</h2>
                    <p class="modal-sub-text">Pick your companion</p>
                </div>
                <button class="modal-close" onclick="closeAllModals()">&times;</button>
            </div>

            <div class="modal-options-list">
                <div class="option-card selected" onclick="selectWidgetOption(this, 'pikachu')">
                    <div class="option-preview widget-style">
                        <img src="../assets/sprites/pikachu/pikachu_happy1.png" class="pixel-art">
                    </div>
                    <div class="option-info">
                        <span class="option-label">Pikachu</span>
                        <span class="option-desc">Chubby rodent Pokémon</span>
                    </div>
                    <i class='bx bxs-check-circle checkmark-icon'></i>
                </div>

                <div class="option-card" onclick="selectWidgetOption(this, 'widget-buddy')">
                    <div class="option-preview widget-style">
                        <img src="../assets/widget-buddy.png" class="pixel-art">
                    </div>
                    <div class="option-info">
                        <span class="option-label">Kirby</span>
                        <span class="option-desc">Small pink spherical creature</span>
                    </div>
                    <i class='bx bxs-check-circle checkmark-icon'></i>
                </div>

                <div class="option-card" onclick="selectWidgetOption(this, 'widget-buddy')">
                    <div class="option-preview widget-style">
                        <img src="../assets/widget-buddy.png" class="pixel-art">
                    </div>
                    <div class="option-info">
                        <span class="option-label">Widget Buddy</span>
                        <span class="option-desc">Emotion-adaptive companion</span>
                    </div>
                    <i class='bx bxs-check-circle checkmark-icon'></i>
                </div>
            </div>

            <button class="apply-btn" onclick="applyWidgetChange()">Apply Changes</button>
        </div>
    </div>

    <script src="../js/spriteEngine.js"></script>
    <script src="../js/router.js"></script>
</body>

</html>
