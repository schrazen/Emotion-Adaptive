<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAUIS Widget</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: transparent;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .widget-shell {
            width: clamp(120px, 90vmin, 340px);
            aspect-ratio: 1 / 1;
            display: grid;
            place-items: center;
            position: relative;
        }

        .sprite-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            cursor: grab;
            user-select: none;
        }

        .sprite-wrap:active {
            cursor: grabbing;
        }

        #widget-sprite {
            width: 86%;
            height: 86%;
            object-fit: contain;
            image-rendering: pixelated;
            user-select: none;
            -webkit-user-drag: none;
        }

        .apm-badge {
            position: absolute;
            bottom: 5%;
            right: 4%;
            min-width: 56px;
            text-align: center;
            background: rgba(12, 16, 25, 0.84);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #f2f5ff;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: clamp(10px, 1.9vmin, 12px);
            font-weight: 700;
            letter-spacing: 0.2px;
            pointer-events: none;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .apm-badge.mood-happy {
            background: rgba(255, 214, 92, 0.92);
            border-color: rgba(255, 238, 176, 0.95);
            color: #3c2d00;
        }

        .apm-badge.mood-neutral {
            background: rgba(74, 163, 255, 0.92);
            border-color: rgba(185, 225, 255, 0.9);
            color: #06213d;
        }

        .apm-badge.mood-angry {
            background: rgba(255, 101, 127, 0.92);
            border-color: rgba(255, 205, 214, 0.92);
            color: #3c0610;
        }

        .widget-resize-grip {
            position: fixed;
            right: 0;
            bottom: 0;
            width: 16px;
            height: 16px;
            border: none;
            background: linear-gradient(135deg, transparent 45%, rgba(255, 255, 255, 0.88) 46%, rgba(255, 255, 255, 0.88) 54%, transparent 55%);
            opacity: 0.72;
            cursor: nwse-resize;
            z-index: 999;
            padding: 0;
        }
    </style>
</head>

<body>
    <main class="widget-shell">
        <div class="sprite-wrap">
            <img id="widget-sprite" alt="Pikachu Widget">
        </div>
        <div id="apm-badge" class="apm-badge">APM 0</div>
    </main>
    <button id="widget-resize-grip" class="widget-resize-grip" aria-label="Resize widget" title="Drag to resize"></button>

    <script src="../js/spriteEngine.js"></script>
    <script src="../js/moodAlgorithmConfig.js"></script>
    <script src="../js/moodTracker.js"></script>
    <script>
        (function () {
            const sprite = document.getElementById('widget-sprite');
            const spriteWrap = document.querySelector('.sprite-wrap');
            const apmBadge = document.getElementById('apm-badge');
            const resizeGrip = document.getElementById('widget-resize-grip');
            let clickCount = 0;
            let clickResetTimer = null;
            let isPointerDown = false;
            let didDrag = false;
            let isResizing = false;
            let pointerStart = { x: 0, y: 0 };

            function normalizeMood(mood) {
                const value = String(mood || 'Neutral').toLowerCase();
                if (value === 'angry') return 'angry';
                if (value === 'happy') return 'happy';
                if (value === 'focused') return 'neutral';
                if (value === 'neutral') return 'neutral';
                return 'neutral';
            }

            function render(state) {
                const moodKey = normalizeMood(state.mood);
                const moodEmoji = moodKey === 'happy' ? '😄' : moodKey === 'angry' ? '😤' : '😐';
                apmBadge.className = `apm-badge mood-${moodKey}`;
                apmBadge.textContent = `${moodEmoji} APM ${state.apm}`;

                const applyCharacter = (character) => {
                    const selectedCharacter = character || 'pikachu';
                    if (window.SpriteEngine) {
                        window.SpriteEngine.play(sprite, selectedCharacter, moodKey);
                    }
                };

                if (window.api && window.api.getSelectedCharacter) {
                    window.api.getSelectedCharacter().then(applyCharacter).catch(() => applyCharacter('pikachu'));
                } else {
                    applyCharacter('pikachu');
                }
            }

            async function openMainApp() {
                if (!window.api) {
                    return;
                }

                if (typeof window.api.returnToNormalMode === 'function') {
                    await window.api.returnToNormalMode();
                    return;
                }

                if (typeof window.api.setWidgetOnlyMode === 'function') {
                    await window.api.setWidgetOnlyMode(false);
                }
            }

            function processQuickClicks() {
                clickCount += 1;

                if (clickResetTimer) {
                    clearTimeout(clickResetTimer);
                }

                if (clickCount >= 2) {
                    clickCount = 0;
                    openMainApp();
                    return;
                }

                clickResetTimer = setTimeout(() => {
                    clickCount = 0;
                }, 500);
            }

            spriteWrap.addEventListener('mousedown', (event) => {
                if (isResizing) {
                    return;
                }

                isPointerDown = true;
                didDrag = false;
                pointerStart = { x: event.screenX, y: event.screenY };

                if (window.api && window.api.beginWidgetDrag) {
                    window.api.beginWidgetDrag(event.screenX, event.screenY);
                }
            });

            window.addEventListener('mousemove', (event) => {
                if (isResizing) {
                    if (window.api && window.api.moveWindowResize) {
                        window.api.moveWindowResize(event.screenX, event.screenY);
                    }
                    return;
                }

                if (!isPointerDown) {
                    return;
                }

                const deltaX = Math.abs(event.screenX - pointerStart.x);
                const deltaY = Math.abs(event.screenY - pointerStart.y);
                if (deltaX > 3 || deltaY > 3) {
                    didDrag = true;
                }

                if (window.api && window.api.moveWidgetDrag) {
                    window.api.moveWidgetDrag(event.screenX, event.screenY);
                }
            });

            window.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    if (window.api && window.api.endWindowResize) {
                        window.api.endWindowResize();
                    }
                    return;
                }

                if (!isPointerDown) {
                    return;
                }

                isPointerDown = false;
                if (window.api && window.api.endWidgetDrag) {
                    window.api.endWidgetDrag();
                }

                if (!didDrag) {
                    processQuickClicks();
                }
            });

            if (resizeGrip) {
                resizeGrip.addEventListener('mousedown', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    isResizing = true;
                    isPointerDown = false;

                    if (window.api && window.api.beginWindowResize) {
                        window.api.beginWindowResize(event.screenX, event.screenY, 'bottom-right');
                    }
                });
            }

            if (window.MoodTracker) {
                window.MoodTracker.start();
                window.MoodTracker.subscribe(render);
            }
        })();
    </script>
</body>

</html>
