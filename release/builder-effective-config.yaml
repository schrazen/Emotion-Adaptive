directories:
  output: release
  buildResources: build
appId: com.schrazen.emotionadaptive
productName: Emotion Adaptive
files:
  - filter:
      - src/**/*
      - package.json
asarUnpack:
  - '**/node_modules/sqlite3/**'
  - '**/node_modules/uiohook-napi/**'
win:
  target:
    - nsis
    - portable
  icon: src/frontend/assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: Emotion-Adaptive-Portable-${version}.${ext}
electronVersion: 41.2.1
